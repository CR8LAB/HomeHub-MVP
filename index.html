<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HomeHub</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body >

<div id="app"  >

    <!-- Header -->
    <header class="app-header">

    <div class="header-top">

       <div class="header-brand">

    <img
        src="assets/images/36830.png"
        alt="HomeHub"
        class="header-logo"
    >

    <p class="greeting" id="headerGreeting">
        Good Morning
    </p>

    <p class="date" id="headerDate">
        Loading date...
    </p>

</div>

        <div class="header-actions">

            <button
                id="notificationBtn"
                class="header-icon-btn"
                type="button"
                aria-label="Notifications"
            >
                <i class="bi bi-bell"></i>
            </button>

            <button
                id="userBtn"
                class="header-icon-btn"
                type="button"
                aria-label="User profile"
            >
                <i class="bi bi-person-circle"></i>
            </button>

            <button
                id="settingsBtn"
                class="header-icon-btn"
                type="button"
                aria-label="Settings"
            >
                <i class="bi bi-gear"></i>
            </button>

        </div>

    </div>

    <div class="header-status">

        <div class="weather">

            <i
                id="headerWeatherIcon"
                class="bi bi-cloud-sun-fill"
            ></i>

            <span id="headerWeatherText">
                Loading weather...
            </span>

        </div>

        <div class="time">

            <span id="headerTime">
                --:--
            </span>

        </div>

    </div>

</header>

    <!-- Main -->
    <main id="app-content" >

       
    </main>

    <!-- Navigation -->
    <footer>

        <nav>

            <button id="home-btn" class="nav-btn active">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </button>

            <button id="todo-btn" class="nav-btn">
                <i class="bi bi-card-checklist"></i>
                <span>To-Do</span>
            </button>

            <button id="homeinfo-btn" class="nav-btn">
                <i class="bi bi-house-heart"></i>
                <span>Home Info</span>
            </button>

            <button id="emergency-btn" class="nav-btn">
                <i class="bi bi-shield-exclamation"></i>
                <span>Emergency</span>
            </button>

        </nav>

    </footer>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
